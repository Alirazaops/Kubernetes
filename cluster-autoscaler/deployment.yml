apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-nginx
  lables:
    app:  app-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app:  app-nginx
  template:
    metadata:
      lables:
        app:  app-nginx
    spec:
      containers:
      - name: nginx
        image:  nginx:latest
        ports:
        - containerPort:  80