apiVersion: app/v1
kind: Deployment
Metadata:
  name: nginx:replicaset
spec:
  replicas: 3
  selector:
    matchLables:
      app: nginx
  template:
    metadata:
      lables:
        app:  nginx
    spec:
      containers:
        - name: nginx-container
          image:  nginx:latest
          ports:
            - containerPort: 80