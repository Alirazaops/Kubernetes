apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace:  default
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  replicas: 4
  selector:
    matchLabels:
      app:  myapp
  template:
    metadata:
      lables:
        app:  myapp
    spec:
      containers:
        - name: myapp
          image:  httpd
          ports:
          - name: http
            containerPort: 8181

---

apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  type: NodePort
  selector:
    app: myapp
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  